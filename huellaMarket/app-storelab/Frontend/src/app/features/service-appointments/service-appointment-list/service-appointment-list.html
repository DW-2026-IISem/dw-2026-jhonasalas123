<app-page-header
  title="Citas de servicio"
  subtitle="Administra las citas de servicio registradas en HuellaMarket."
>
  <p-tag
    [value]="rows().length + ' activos'"
    severity="info"
    [rounded]="true"
  />

  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nueva cita</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">
    {{ error() }}
  </p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar citas de servicio"
          placeholder="Buscar por nombre o descripción..."
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>

      @if (filter()) {
        <p class="mt-2 text-xs text-slate-500">
          {{ visibleRows().length }} de {{ rows().length }} coinciden con «{{ filter() }}».
        </p>
      }
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="nombre">
          <div class="flex items-center gap-1">
            Nombre
            <p-sort-icon field="nombre" />
          </div>
        </th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-24 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ row.nombre }}</p>
          <p class="text-xs text-slate-400">#{{ row.id }}</p>
        </td>

        <td>
          <p class="text-sm text-slate-700">{{ row.descripcion || '—' }}</p>
        </td>

        <td>
          <app-status-tag
            [status]="row.isActive ? 'active' : 'inactive'"
          />
        </td>

        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              icon="pi pi-pencil"
              aria-label="Editar cita de servicio"
              pTooltip="Editar"
              (click)="openEdit(row)"
            ></button>

            <button
              pButton
              type="button"
              text
              rounded
              severity="warn"
              icon="pi pi-ban"
              aria-label="Desactivar cita de servicio"
              pTooltip="Baja lógica"
              (click)="deactivate(row)"
            ></button>

            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              icon="pi pi-trash"
              aria-label="Eliminar cita de servicio"
              pTooltip="Eliminar definitivamente"
              (click)="remove(row)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ninguna cita coincide con la búsqueda. Borra el filtro para ver todas."
            />
          } @else {
            <app-empty-state
              icon="pi pi-calendar"
              title="Sin citas de servicio activas"
              message="Crea la primera con el botón «Nueva cita»."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-service-appointment-form
    [serviceAppointment]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
