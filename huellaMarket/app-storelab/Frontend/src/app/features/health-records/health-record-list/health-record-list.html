<app-page-header
  title="Fichas Sanitarias"
  subtitle="Consulta y administra las fichas sanitarias de las mascotas."
>
  <p-button
    label="Nueva ficha"
    icon="pi pi-plus"
    (onClick)="openCreate()"
  />
</app-page-header>

@if (error()) {
  <p-message severity="error">
  {{ error() }}
</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="10"
  dataKey="id"
>
  <ng-template #caption>
    <div class="flex justify-between items-center gap-3">
      <span class="font-semibold">Listado de fichas sanitarias</span>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre o descripción..."
        [value]="filter()"
        (input)="filter.set($any($event.target).value)"
      />
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th class="text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-record>
    <tr>
      <td>{{ record.id }}</td>
      <td class="font-medium">{{ record.nombre }}</td>
      <td>{{ record.descripcion || '—' }}</td>
      <td>
        <app-status-tag
          [status]="record.is_active ? 'active' : 'inactive'"
        />
      </td>
      <td>
        <div class="flex justify-end gap-2">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="Editar"
            (onClick)="openEdit(record)"
          />
          <p-button
            icon="pi pi-ban"
            severity="warn"
            [text]="true"
            [rounded]="true"
            pTooltip="Desactivar"
            (onClick)="deactivate(record)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="Eliminar"
            (onClick)="remove(record)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5">
        <app-empty-state
          icon="pi pi-file"
          title="Sin fichas sanitarias"
          message="Todavía no hay fichas sanitarias registradas."
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(32rem, 95vw)' }"
>
  <app-health-record-form
    [healthRecord]="editing()"
    [saving]="saving()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
<p-confirmdialog />
