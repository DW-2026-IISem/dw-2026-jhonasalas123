<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

  <div class="flex flex-col gap-2">
    <label for="health-record-name">Nombre</label>
    <input
      pInputText
      id="health-record-name"
      formControlName="nombre"
      [fluid]="true"
      placeholder="Nombre de la ficha sanitaria"
    />
    @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
      <p-message severity="error">
        El nombre es obligatorio y debe tener máximo 120 caracteres.
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="health-record-description">Descripción</label>
    <textarea
      pTextarea
      id="health-record-description"
      formControlName="descripcion"
      [fluid]="true"
      rows="4"
      placeholder="Descripción de la ficha sanitaria"
    ></textarea>
  </div>

  <div class="flex justify-end gap-2">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      type="button"
      (onClick)="cancelled.emit()"
    />
    <p-button
      label="Guardar"
      icon="pi pi-save"
      type="submit"
      [loading]="saving()"
    />
  </div>

</form>
