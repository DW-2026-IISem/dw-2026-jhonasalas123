<app-page-header
  title="Mascotas"
  subtitle="Administra las mascotas registradas en HuellaMarket."
>
  <p-tag [value]="rows().length + ' activas'" severity="info" [rounded]="true" />

  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nueva mascota</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">
    {{ error() }}
  </p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar mascotas"
          placeholder="Buscar por nombre o descripción..."
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>

      @if (filter()) {
        <p class="mt-2 text-xs text-slate-500">
          {{ visibleRows().length }} de {{ rows().length }} coinciden con «{{ filter() }}».
        </p>
      }
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="nombre">
          <div class="flex items-center gap-1">
            Nombre
            <p-sort-icon field="nombre" />
          </div>
        </th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-24 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-pet>
      <tr>
        <td>
          <p class="font-medium text-slate-800">{{ pet.nombre }}</p>
          <p class="text-xs text-slate-400">#{{ pet.id }}</p>
        </td>
        <td>
          <p class="text-sm text-slate-700">
            {{ pet.descripcion || 'Sin descripción' }}
          </p>
        </td>
        <td>
          <app-status-tag [status]="pet.isActive ? 'active' : 'inactive'" />
        </td>
        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton type="button" text rounded severity="secondary"
              icon="pi pi-pencil" aria-label="Editar mascota"
              pTooltip="Editar" (click)="openEdit(pet)"
            ></button>
            <button
              pButton type="button" text rounded severity="warn"
              icon="pi pi-ban" aria-label="Desactivar mascota"
              pTooltip="Baja lógica" (click)="deactivate(pet)"
            ></button>
            <button
              pButton type="button" text rounded severity="danger"
              icon="pi pi-trash" aria-label="Eliminar mascota"
              pTooltip="Eliminar definitivamente" (click)="remove(pet)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ninguna mascota coincide con la búsqueda. Borra el filtro para ver todas."
            />
          } @else {
            <app-empty-state
              icon="pi pi-heart"
              title="Sin mascotas activas"
              message="Registra la primera con el botón «Nueva mascota»."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-pet-form
    [pet]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
