<app-page-header
  title="Inventario"
  subtitle="Control de existencias y niveles mínimos de stock."
>
  <p-tag
    [value]="rows().length + ' registros'"
    severity="info"
    [rounded]="true"
  />

  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo registro</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">
    {{ error() }}
  </p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar inventario"
          placeholder="Buscar por ubicación, artículo o stock..."
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Ubicación</th>
        <th>Artículo</th>
        <th>Cantidad</th>
        <th>Stock mínimo</th>
        <th>Actualización</th>
        <th class="w-24 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.ubicacion_id }}</td>
        <td>{{ row.item_id }}</td>
        <td>{{ row.cantidad }}</td>
        <td>{{ row.stock_minimo }}</td>
        <td>{{ row.updatedAt ? (row.updatedAt | date: 'short') : '—' }}</td>
        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              icon="pi pi-pencil"
              aria-label="Editar inventario"
              pTooltip="Editar"
              (click)="openEdit(row)"
            ></button>

            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              icon="pi pi-trash"
              aria-label="Eliminar inventario"
              pTooltip="Eliminar"
              (click)="remove(row)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7">
          <app-empty-state
            icon="pi pi-box"
            title="Sin registros de inventario"
            message="Crea el primer registro con el botón «Nuevo registro»."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-inventory-form
    [inventory]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
