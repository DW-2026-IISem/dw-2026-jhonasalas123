<app-page-header
  title="Inventario"
  subtitle="Control de existencias y niveles mínimos de stock."
>
  <p-tag
    [value]="rows().length + ' registros'"
    severity="info"
    [rounded]="true"
  />
  <button
    pButton
    label="Nuevo registro"
    icon="pi pi-plus"
    (click)="openCreate()"
  ></button>
</app-page-header>

<p-confirmdialog />

<div class="mb-4">
  <input
    pInputText
    type="text"
    placeholder="Buscar por ubicación, artículo o stock..."
    [ngModel]="filter()"
    (ngModelChange)="filter.set($event)"
    class="w-full md:w-80"
  />
</div>

@if (error()) {
  <p-message severity="error">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  [tableStyle]="{ 'min-width': '45rem' }"
>
  <ng-template #header>
    <tr>
      <th>ID</th>
      <th>Ubicación</th>
      <th>Artículo</th>
      <th>Cantidad</th>
      <th>Stock mínimo</th>
      <th>Actualización</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td>{{ row.id }}</td>
      <td>{{ row.ubicacion_id }}</td>
      <td>{{ row.item_id }}</td>
      <td>{{ row.cantidad }}</td>
      <td>{{ row.stock_minimo }}</td>
      <td>{{ row.updatedAt ? (row.updatedAt | date: 'short') : '—' }}</td>
      <td>
        <button
          pButton
          text
          rounded
          icon="pi pi-pencil"
          pTooltip="Editar"
          (click)="openEdit(row)"
        ></button>
        <button
          pButton
          text
          rounded
          severity="danger"
          icon="pi pi-trash"
          pTooltip="Eliminar"
          (click)="remove(row)"
        ></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="7">
        <app-empty-state
          title="Sin registros de inventario"
          description="No hay registros que coincidan con la búsqueda."
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="title()"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: 'min(95vw, 34rem)' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <app-inventory-form
    [inventory]="editing()"
    [resetKey]="resetKey()"
    [saving]="saving()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
